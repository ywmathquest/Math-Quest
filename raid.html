<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Boss Raid · Math Quest</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0d1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #gameWrapper {
      background: #1a1a2e;
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      width: fit-content;
    }
    canvas {
      display: block;
      width: 1000px;
      height: 600px;
      border-radius: 20px;
      background: #16213e;
      cursor: crosshair;
      box-shadow: inset 0 0 30px #0f3460;
    }
    #ui {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      color: #e0e0ff;
      font-weight: bold;
      padding: 0 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    #ui > div {
      background: #0f0f1f;
      padding: 10px 18px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid #3a3a6a;
      box-shadow: 0 4px 0 #0b0b18;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #ff3b6f;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.9rem;
      color: white;
      letter-spacing: 0.5px;
    }
    #mathShield { background: #3b1f6b; border-color: #a374ff; }
    #mathShield span { background: #a374ff; padding: 2px 12px; border-radius: 30px; color: #0d0d1a; margin-left: 6px; }
    button {
      background: #2d2d5e;
      border: none;
      color: white;
      font-weight: bold;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 4px solid #1a1a3a;
      transition: 0.07s;
    }
    button:active { transform: translateY(2px); border-bottom-width: 2px; }
    #restartBtn { background: #c44569; border-bottom-color: #7f2a45; }
    #hudRight { display: flex; gap: 14px; flex-wrap: wrap; }
    #playerCount { background: #1f3a5f; border-color: #3a7abd; }
    .offline-badge { background: #555; padding: 4px 12px; border-radius: 30px; font-size: 0.8rem; }
    @media (max-width: 1040px) {
      canvas { width: 100%; height: auto; aspect-ratio: 1000/600; }
      #gameWrapper { padding: 12px; width: 98vw; }
    }
  </style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <div id="ui">
    <div>❤️ <span id="healthDisplay">0</span></div>
    <div id="mathShield">🧮 SHIELD <span id="shieldDisplay">0</span></div>
    <div>🔥 <span id="bossHpDisplay">100</span>%</div>
    <div id="hudRight">
      <span class="badge" id="phaseDisplay">PHASE 1</span>
      <div id="playerCount">👥 <span id="playerCountNum">1</span></div>
      <button id="restartBtn">↻ RESTART</button>
    </div>
  </div>
  <div style="color:#888; font-size:0.8rem; text-align:center; margin-top:8px;">
    <span class="offline-badge">🌐 ONLINE · <span id="statusDot">●</span> <span id="connectionStatus">connected</span></span>
    <span style="margin-left:12px;">⬆⬇⬅➡ + SPACE</span>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
  // ============================================================
  // FIREBASE CONFIG — REPLACE WITH YOUR OWN
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDnbg5hTF71flj8Cw2hYLwdlQcoTY3CEQc",
    authDomain: "mathquest-f54b5.firebaseapp.com",
    projectId: "mathquest-f54b5",
    storageBucket: "mathquest-f54b5.firebasestorage.app",
    messagingSenderId: "817224705216",
    appId: "1:817224705216:web:19f52a4d1738c6a4d83925",
    databaseURL: "https://mathquest-f54b5-default-rtdb.firebaseio.com/"
  };

  // ============================================================
  // FIREBASE INIT
  // ============================================================
  let db = null;
  let myPlayerId = null;
  let roomRef = null;
  let connectedRef = null;
  let gameStateRef = null;
  let playerRef = null;
  let presenceRef = null;

  function initFirebase() {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    connectedRef = db.ref('.info/connected');
    // use a fixed room "boss_raid_global"
    roomRef = db.ref('bossRaid/global');
    gameStateRef = roomRef.child('gameState');
    playerRef = roomRef.child('players');
    presenceRef = roomRef.child('presence');
    return db;
  }

  // ============================================================
  // GAME STATE (shared)
  // ============================================================
  const G = {
    players: {},          // keyed by playerId: { x, y, health, shield, name? }
    boss: { x: 500, y: 80, w: 120, h: 80, hp: 100, maxHp: 100, phase: 1 },
    projectiles: [],
    gameOver: false,
    victory: false,
    frame: 0,
    lastUpdate: 0,
  };

  // local player
  let localPlayer = {
    id: null,
    x: 300, y: 460,
    w: 36, h: 48,
    vx: 0, vy: 0,
    health: 5,
    maxHealth: 5,
    invincible: 0,
    shield: false,
    shieldTimer: 0,
    onGround: false,
    input: { left: false, right: false, up: false, space: false }
  };

  // math shield
  let mathShieldCharges = 2;
  const maxShieldCharges = 3;
  let showMathUI = false;
  let mathQuestion = null;
  let mathAnswer = null;
  let mathInput = '';

  // DOM refs
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const healthSpan = document.getElementById('healthDisplay');
  const shieldSpan = document.getElementById('shieldDisplay');
  const bossHpSpan = document.getElementById('bossHpDisplay');
  const phaseSpan = document.getElementById('phaseDisplay');
  const playerCountNum = document.getElementById('playerCountNum');
  const statusDot = document.getElementById('statusDot');
  const connectionStatus = document.getElementById('connectionStatus');

  const GROUND_Y = 500;

  // ============================================================
  // FIREBASE SYNC
  // ============================================================
  function sendLocalState() {
    if (!myPlayerId || !playerRef) return;
    const data = {
      x: localPlayer.x,
      y: localPlayer.y,
      health: localPlayer.health,
      shield: localPlayer.shield,
      invincible: localPlayer.invincible,
      lastUpdate: Date.now()
    };
    playerRef.child(myPlayerId).update(data);
  }

  function sendBossState() {
    if (!gameStateRef) return;
    gameStateRef.update({
      boss: G.boss,
      projectiles: G.projectiles,
      gameOver: G.gameOver,
      victory: G.victory,
      lastUpdate: Date.now()
    });
  }

  function listenToGame() {
    if (!gameStateRef) return;
    gameStateRef.on('value', (snap) => {
      const data = snap.val();
      if (!data) return;
      if (data.boss) {
        // only update if server has newer data
        if (data.lastUpdate > (G.lastUpdate || 0)) {
          G.boss = data.boss;
          G.projectiles = data.projectiles || [];
          G.gameOver = data.gameOver || false;
          G.victory = data.victory || false;
          G.lastUpdate = data.lastUpdate;
          updateUI();
        }
      }
    });
  }

  function listenToPlayers() {
    if (!playerRef) return;
    playerRef.on('value', (snap) => {
      const data = snap.val();
      if (!data) return;
      G.players = data;
      // update player count
      const count = Object.keys(data).length;
      playerCountNum.textContent = count;
    });
  }

  function listenToPresence() {
    if (!presenceRef) return;
    presenceRef.on('value', (snap) => {
      const data = snap.val();
      if (!data) return;
      // cleanup stale players (older than 10s)
      const now = Date.now();
      let changed = false;
      Object.keys(data).forEach(id => {
        if (now - (data[id] || 0) > 15000) {
          if (playerRef) playerRef.child(id).remove();
          presenceRef.child(id).remove();
          changed = true;
        }
      });
      if (changed) {
        // re-trigger player count update
        playerRef.once('value', (s) => {
          const d = s.val();
          if (d) playerCountNum.textContent = Object.keys(d).length;
        });
      }
    });
  }

  // ============================================================
  // BOSS LOGIC (runs locally, but only host sends updates)
  // ============================================================
  let isHost = false;
  let hostCheckTimer = 0;

  function checkHost() {
    // first player in the room becomes host
    if (!playerRef) return;
    playerRef.once('value', (snap) => {
      const data = snap.val();
      if (!data) return;
      const ids = Object.keys(data);
      if (ids.length > 0 && ids[0] === myPlayerId) {
        isHost = true;
        console.log('👑 I am the host!');
      } else {
        isHost = false;
      }
    });
  }

  function bossUpdate() {
    if (!isHost) return;
    const b = G.boss;
    if (G.gameOver || G.victory) return;

    // boss movement
    b.x += Math.sin(G.frame * 0.018) * 0.8;
    b.y = 80 + Math.sin(G.frame * 0.025) * 12;

    // phase
    const hpPercent = (b.hp / b.maxHp) * 100;
    if (hpPercent < 30) b.phase = 3;
    else if (hpPercent < 60) b.phase = 2;
    else b.phase = 1;
    phaseSpan.textContent = `PHASE ${b.phase}`;

    // auto attack every N frames (simplified for online)
    if (G.frame % (80 - b.phase * 5) === 0) {
      // slam attack: damage nearby players
      const slamX = 200 + Math.random() * 600;
      G.players.forEach((p, id) => {
        if (Math.abs(p.x - slamX) < 100 && p.y > GROUND_Y - 70) {
          // damage player
          const playerData = G.players[id];
          if (playerData && !playerData.shield && playerData.invincible <= 0) {
            const newHealth = (playerData.health || 5) - 1;
            playerRef.child(id).update({ health: newHealth, invincible: 30 });
            if (newHealth <= 0) {
              G.gameOver = true;
              sendBossState();
            }
          }
        }
      });
      // projectile attack
      if (b.phase >= 2 && Math.random() > 0.5) {
        const targets = Object.keys(G.players);
        targets.forEach((id, i) => {
          const p = G.players[id];
          if (!p) return;
          const dx = p.x - b.x;
          const dy = p.y - b.y;
          const dist = Math.hypot(dx, dy) || 1;
          G.projectiles.push({
            x: b.x + 20, y: b.y + 30,
            vx: (dx / dist) * (4 + b.phase),
            vy: (dy / dist) * (4 + b.phase),
            r: 12,
            life: 120,
            owner: id
          });
        });
      }
      sendBossState();
    }

    // projectiles
    G.projectiles.forEach(proj => {
      proj.x += proj.vx;
      proj.y += proj.vy;
      proj.life--;
      // hit players
      Object.keys(G.players).forEach(id => {
        const p = G.players[id];
        if (!p) return;
        if (Math.hypot(proj.x - p.x, proj.y - p.y) < 28) {
          if (!p.shield && p.invincible <= 0) {
            const newHealth = (p.health || 5) - 1;
            playerRef.child(id).update({ health: newHealth, invincible: 30 });
            if (newHealth <= 0) {
              G.gameOver = true;
              sendBossState();
            }
          }
          proj.life = 0;
        }
      });
    });
    G.projectiles = G.projectiles.filter(p => p.life > 0 && p.x > -50 && p.x < 1050 && p.y > -50 && p.y < 700);

    // boss HP check
    if (b.hp <= 0) {
      b.hp = 0;
      G.victory = true;
      sendBossState();
    }

    // update boss state periodically
    if (G.frame % 5 === 0) {
      sendBossState();
    }
  }

  // ============================================================
  // LOCAL PLAYER UPDATE
  // ============================================================
  function updateLocalPlayer() {
    if (G.gameOver || G.victory) return;
    const p = localPlayer;
    const accel = 0.7;
    const friction = 0.85;
    if (p.input.left) p.vx -= accel;
    if (p.input.right) p.vx += accel;
    p.vx *= friction;
    if (Math.abs(p.vx) < 0.1) p.vx = 0;
    if (Math.abs(p.vx) > 7) p.vx = Math.sign(p.vx) * 7;

    p.x += p.vx;
    p.vy += 0.6;
    p.y += p.vy;
    if (p.y > GROUND_Y - p.h) {
      p.y = GROUND_Y - p.h;
      p.vy = 0;
      p.onGround = true;
    } else {
      p.onGround = false;
    }
    if (p.input.up && p.onGround) {
      p.vy = -11;
      p.onGround = false;
    }
    p.x = Math.max(20, Math.min(980 - p.w, p.x));

    if (p.invincible > 0) p.invincible--;
    if (p.shield) {
      p.shieldTimer--;
      if (p.shieldTimer <= 0) p.shield = false;
    }

    // send state
    if (G.frame % 2 === 0) sendLocalState();
  }

  // ============================================================
  // MATH SHIELD
  // ============================================================
  function generateMathProblem() {
    const a = Math.floor(Math.random() * 12) + 3;
    const b = Math.floor(Math.random() * 12) + 2;
    const ops = ['+', '-', '×'];
    const op = ops[Math.floor(Math.random() * ops.length)];
    let ans;
    let display;
    if (op === '+') { ans = a + b; display = `${a} + ${b}`; }
    else if (op === '-') { ans = a - b; display = `${a} - ${b}`; }
    else { ans = a * b; display = `${a} × ${b}`; }
    return { question: display, answer: ans };
  }

  function tryActivateShield() {
    if (G.gameOver || G.victory) return;
    if (mathShieldCharges > 0) {
      mathShieldCharges--;
      localPlayer.shield = true;
      localPlayer.shieldTimer = 90;
      // also damage boss if host
      if (isHost) {
        G.boss.hp -= 6;
        if (G.boss.hp < 0) G.boss.hp = 0;
        sendBossState();
      }
      updateUI();
      sendLocalState();
    } else {
      const prob = generateMathProblem();
      mathQuestion = prob.question;
      mathAnswer = prob.answer;
      showMathUI = true;
      mathInput = '';
    }
  }

  // ============================================================
  // DRAW
  // ============================================================
  function draw() {
    ctx.clearRect(0, 0, 1000, 600);

    // ground
    ctx.fillStyle = '#2a2a4a';
    ctx.fillRect(0, GROUND_Y, 1000, 100);
    ctx.fillStyle = '#3d3d6b';
    for (let i = 0; i < 20; i++) {
      ctx.fillRect(i*55 + (G.frame*0.5)%55, GROUND_Y+6, 30, 8);
    }

    // boss
    const b = G.boss;
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ff3b6f';
    const hpPercent = b.hp / b.maxHp;
    const gradient = ctx.createRadialGradient(b.x-20, b.y-20, 10, b.x, b.y, 80);
    if (hpPercent > 0.6) gradient.addColorStop(0, '#ff6b8a');
    else if (hpPercent > 0.3) gradient.addColorStop(0, '#ff4a6a');
    else gradient.addColorStop(0, '#cc2244');
    gradient.addColorStop(1, '#550f22');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.w/2, b.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffdd99';
    ctx.font = 'bold 38px sans-serif';
    ctx.fillText('👹', b.x-34, b.y+16);

    // boss HP bar
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#222244';
    ctx.fillRect(b.x-60, b.y-70, 120, 16);
    ctx.fillStyle = hpPercent > 0.4 ? '#44dd88' : '#ff3b6f';
    ctx.fillRect(b.x-60, b.y-70, 120 * hpPercent, 16);
    ctx.strokeStyle = '#ffffff30';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x-60, b.y-70, 120, 16);

    // projectiles
    G.projectiles.forEach(p => {
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#ff8844';
      ctx.fillStyle = '#ff5533';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#ffcc66';
      ctx.beginPath();
      ctx.arc(p.x-4, p.y-4, 5, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // remote players
    Object.keys(G.players).forEach(id => {
      if (id === myPlayerId) return;
      const p = G.players[id];
      if (!p) return;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#4488ff';
      ctx.fillStyle = p.shield ? '#66ddff' : '#88aaff';
      ctx.fillRect(p.x - 18, p.y - 24, 36, 48);
      ctx.fillStyle = '#ffcc99';
      ctx.beginPath();
      ctx.arc(p.x, p.y - 30, 16, 0, Math.PI*2);
      ctx.fill();
      // health bar
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#1a1a33';
      ctx.fillRect(p.x - 20, p.y - 52, 40, 6);
      ctx.fillStyle = (p.health || 5) > 3 ? '#44dd88' : '#ff3b6f';
      ctx.fillRect(p.x - 20, p.y - 52, 40 * ((p.health||5)/5), 6);
      // name
      ctx.fillStyle = '#ccddff';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚔️', p.x, p.y - 58);
    });

    // local player
    const lp = localPlayer;
    ctx.shadowBlur = 15;
    ctx.shadowColor = lp.shield ? '#66ccff' : '#222255';
    ctx.fillStyle = lp.shield ? '#66ddff' : (lp.invincible>0 && lp.invincible%6<3 ? '#ffaa88' : '#ffcc88');
    ctx.fillRect(lp.x, lp.y, lp.w, lp.h);
    ctx.fillStyle = '#ffcc99';
    ctx.beginPath();
    ctx.arc(lp.x+lp.w/2, lp.y-8, 16, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = lp.shield ? '#3399ff' : '#6688cc';
    ctx.fillRect(lp.x+6, lp.y-20, 24, 12);
    if (lp.shield) {
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#66ddff';
      ctx.strokeStyle = '#88eeff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(lp.x+lp.w/2, lp.y+8, 30, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a1a33';
    ctx.fillRect(lp.x-4, lp.y-30, lp.w+8, 6);
    ctx.fillStyle = lp.health > 3 ? '#44dd88' : (lp.health > 1 ? '#ffcc44' : '#ff3b6f');
    ctx.fillRect(lp.x-4, lp.y-30, (lp.w+8) * (lp.health/lp.maxHealth), 6);

    // math UI
    if (showMathUI) {
      ctx.shadowBlur = 40;
      ctx.shadowColor = '#a374ff';
      ctx.fillStyle = 'rgba(20,10,40,0.85)';
      ctx.fillRect(300, 180, 400, 150);
      ctx.strokeStyle = '#a374ff';
      ctx.lineWidth = 4;
      ctx.strokeRect(300, 180, 400, 150);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 34px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('🧮  SOLVE:  ' + mathQuestion, 500, 250);
      ctx.font = '28px monospace';
      ctx.fillStyle = '#ccddff';
      ctx.fillText('ANSWER: ' + mathInput + ' █', 500, 300);
      ctx.textAlign = 'left';
    }

    // game over / victory
    if (G.gameOver) {
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#ff2244';
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, 1000, 600);
      ctx.fillStyle = '#ff4466';
      ctx.font = 'bold 68px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💀 DEFEATED', 500, 300);
    } else if (G.victory) {
      ctx.shadowBlur = 50;
      ctx.shadowColor = '#ffdd44';
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, 1000, 600);
      ctx.fillStyle = '#ffdd44';
      ctx.font = 'bold 72px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🏆 VICTORY!', 500, 280);
      ctx.font = '28px sans-serif';
      ctx.fillStyle = '#aaffaa';
      ctx.fillText('Boss defeated! Math + might = glory', 500, 360);
    }
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
  }

  // ============================================================
  // UI UPDATE
  // ============================================================
  function updateUI() {
    healthSpan.textContent = localPlayer.health;
    shieldSpan.textContent = mathShieldCharges;
    bossHpSpan.textContent = Math.round((G.boss.hp / G.boss.maxHp) * 100);
  }

  // ============================================================
  // GAME LOOP
  // ============================================================
  function gameLoop() {
    G.frame++;

    // update local player
    updateLocalPlayer();

    // boss logic (host only)
    if (isHost) {
      bossUpdate();
    }

    // sync local health with remote
    if (G.players[myPlayerId]) {
      const remote = G.players[myPlayerId];
      if (remote && remote.health !== undefined) {
        localPlayer.health = remote.health;
        localPlayer.invincible = remote.invincible || 0;
        localPlayer.shield = remote.shield || false;
      }
    }

    updateUI();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ============================================================
  // INPUT
  // ============================================================
  document.addEventListener('keydown', (e) => {
    const key = e.key;
    if (key === 'ArrowLeft') { e.preventDefault(); localPlayer.input.left = true; }
    if (key === 'ArrowRight') { e.preventDefault(); localPlayer.input.right = true; }
    if (key === 'ArrowUp') { e.preventDefault(); localPlayer.input.up = true; }
    if (key === ' ') {
      e.preventDefault();
      if (showMathUI) {
        if (e.key === 'Enter') {
          const val = parseInt(mathInput);
          if (val === mathAnswer) {
            mathShieldCharges = Math.min(maxShieldCharges, mathShieldCharges + 1);
            showMathUI = false;
            mathInput = '';
            updateUI();
          } else {
            mathInput = '';
          }
        }
        return;
      }
      tryActivateShield();
    }
    // math input
    if (showMathUI) {
      if (key === 'Enter') {
        const val = parseInt(mathInput);
        if (val === mathAnswer) {
          mathShieldCharges = Math.min(maxShieldCharges, mathShieldCharges + 1);
          showMathUI = false;
          mathInput = '';
          updateUI();
        } else {
          mathInput = '';
        }
        return;
      }
      if (key === 'Backspace') {
        mathInput = mathInput.slice(0, -1);
        return;
      }
      if (key >= '0' && key <= '9') {
        mathInput += key;
        return;
      }
    }
  });

  document.addEventListener('keyup', (e) => {
    const key = e.key;
    if (key === 'ArrowLeft') { e.preventDefault(); localPlayer.input.left = false; }
    if (key === 'ArrowRight') { e.preventDefault(); localPlayer.input.right = false; }
    if (key === 'ArrowUp') { e.preventDefault(); localPlayer.input.up = false; }
    if (key === ' ') e.preventDefault();
  });

  // ============================================================
  // RESTART
  // ============================================================
  document.getElementById('restartBtn').addEventListener('click', () => {
    if (isHost) {
      G.boss.hp = G.boss.maxHp;
      G.gameOver = false;
      G.victory = false;
      G.projectiles = [];
      sendBossState();
      // reset all players
      playerRef.once('value', (snap) => {
        const data = snap.val();
        if (data) {
          Object.keys(data).forEach(id => {
            playerRef.child(id).update({ health: 5, invincible: 0, shield: false });
          });
        }
      });
    }
  });

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    initFirebase();

    // generate unique id
    myPlayerId = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    localPlayer.id = myPlayerId;

    // set initial state
    playerRef.child(myPlayerId).set({
      x: 200 + Math.random() * 600,
      y: GROUND_Y - 48,
      health: 5,
      shield: false,
      invincible: 0,
      lastUpdate: Date.now()
    });

    // connection status
    connectedRef.on('value', (snap) => {
      if (snap.val() === true) {
        statusDot.textContent = '●';
        statusDot.style.color = '#44dd88';
        connectionStatus.textContent = 'connected';
        presenceRef.child(myPlayerId).set(Date.now());
      } else {
        statusDot.textContent = '○';
        statusDot.style.color = '#ff6644';
        connectionStatus.textContent = 'disconnected';
      }
    });

    // presence heartbeat
    setInterval(() => {
      if (presenceRef && myPlayerId) {
        presenceRef.child(myPlayerId).set(Date.now());
      }
    }, 5000);

    // listen to game state
    listenToGame();
    listenToPlayers();
    listenToPresence();

    // check host after a moment
    setTimeout(checkHost, 1000);

    // start loop
    gameLoop();

    console.log('🔥 Online Boss Raid started! ID:', myPlayerId);
  }

  init();
</script>
</body>
</html>
